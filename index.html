<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Apply theme before paint to avoid a flash: light by default, dark only if the user chose it. -->
  <script>
    (function () {
      try {
        document.documentElement.classList.toggle('dark', localStorage.getItem('theme') === 'dark');
      } catch (e) {}
    })();
  </script>

  <!-- Primary Meta -->
  <title>DMGennie – Instagram Comment-to-DM Automation for Creators & Businesses</title>
  <meta name="description"
    content="DMGennie automatically sends Instagram direct messages when users comment keywords on your posts and reels. Built on official Meta APIs. Trusted by 25k+ creators." />
  <meta name="author" content="DMGennie" />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#5b5ef4" />

  <!-- Canonical -->
  <link rel="canonical" href="https://www.dmgennie.in/" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="DMGennie" />
  <meta property="og:url" content="https://www.dmgennie.in/" />
  <meta property="og:title" content="DMGennie – Instagram Comment-to-DM Automation" />
  <meta property="og:description"
    content="Automatically send Instagram direct messages when users comment keywords on your posts. Official Meta APIs. No policy violations." />
  <meta property="og:image" content="https://www.dmgennie.in/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@dmgenie" />
  <meta name="twitter:title" content="DMGennie – Instagram Comment-to-DM Automation" />
  <meta name="twitter:description"
    content="Automatically send Instagram direct messages when users comment keywords on your posts. Official Meta APIs." />
  <meta name="twitter:image" content="https://www.dmgennie.in/og-image.png" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32"
    href="https://storage.googleapis.com/gpt-engineer-file-uploads/aMjanxrDoUP1QJ5krTWiqhWnSbF3/uploads/1758710472461-logo-icon-BG-circle copy.png" />
  <link rel="apple-touch-icon"
    href="https://storage.googleapis.com/gpt-engineer-file-uploads/aMjanxrDoUP1QJ5krTWiqhWnSbF3/uploads/1758710472461-logo-icon-BG-circle copy.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "DMGennie",
    "url": "https://www.dmgennie.in",
    "applicationCategory": "BusinessApplication",
    "description": "Instagram Comment-to-DM Automation tool for creators and businesses using official Meta APIs.",
    "operatingSystem": "Web",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    }
  }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
